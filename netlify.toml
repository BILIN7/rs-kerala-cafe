# Netlify Configuration for RS Kerala Cafe Frontend

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_PUBLIC_API_URL = "https://rs-kerala-cafe.onrender.com/api"
  NEXT_PUBLIC_SOCKET_URL = "https://rs-kerala-cafe.onrender.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security Headers & Caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
